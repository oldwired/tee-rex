name: ci
on:
  push:
    branches: [master]
  pull_request:

# Minimal-by-default token scope. Every job in this workflow only
# needs to read repo contents (checkout, run tests, fetch deps).
# Explicit permissions block prevents GITHUB_TOKEN from inheriting
# broader rights from repo/org defaults.
permissions:
  contents: read

jobs:
  test:
    name: build + test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  race:
    # tee-rex_test.go is white-box and exercises the concurrent fanOut
    # path, so the race detector is the job that actually matters here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  cross-compile-windows:
    name: cross-compile (windows/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Windows build
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # gofmt is non-fatal in go itself but a hard fail here — any
      # unformatted file leaves a noisy diff for future contributors.
      - name: gofmt
        run: |
          diff=$(gofmt -l -d .)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo
            echo "Files above are not gofmt-clean. Run 'gofmt -w .' locally."
            exit 1
          fi

      - name: golangci-lint
        # golangci-lint-action v8+ is required for golangci-lint v2.x
        # (v6 only supports v1.x); v9 is the first release on the Node 24
        # runtime, so it avoids the Node 20 deprecation warning.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      # Install govulncheck directly rather than using govulncheck-action,
      # which still bundles Node 20 sub-actions and tries to cache on a
      # go.sum that a stdlib-only module doesn't have. cache: false keeps
      # setup-go from emitting that same "go.sum not found" warning.
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
